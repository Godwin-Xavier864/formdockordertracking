<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Order – Delivery Status</title>
  <meta name="description" content="Real-time shipment and delivery status for your order. Enter your tracking token or open the link shared by the seller." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0d14;
      --surface: rgba(255,255,255,0.04);
      --surface-2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --green: #10b981;
      --green-bg: rgba(16,185,129,0.12);
      --green-border: rgba(16,185,129,0.25);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245,158,11,0.1);
      --blue: #3b82f6;
      --blue-bg: rgba(59,130,246,0.1);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.1);
    }
    html, body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Background Orbs ─────────────────────────────────────────── */
    .bg-orbs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-a { width: 500px; height: 500px; background: #6366f1; top: -150px; left: -100px; animation-duration: 20s; }
    .orb-b { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; right: -80px; animation-duration: 25s; animation-delay: -8s; }
    .orb-c { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 50%; transform: translateX(-50%); animation-duration: 15s; animation-delay: -4s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 40px) scale(1.08); }
    }

    /* ── Layout ──────────────────────────────────────────────────── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px 60px;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .header {
      width: 100%; max-width: 680px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 32px 0;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }
    .logo-text { font-size: 1rem; font-weight: 600; color: var(--text); }
    .header-tag {
      font-size: 0.75rem; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 4px 12px; border-radius: 999px;
    }

    /* ── Card ─────────────────────────────────────────────────────── */
    .card {
      width: 100%; max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    /* ── Lookup Form ─────────────────────────────────────────────── */
    .lookup-section { text-align: center; }
    .lookup-icon { font-size: 3rem; margin-bottom: 16px; }
    .lookup-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .lookup-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    .lookup-form { display: flex; gap: 10px; max-width: 480px; margin: 0 auto; }
    .lookup-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem; color: var(--text);
      outline: none; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .lookup-input::placeholder { color: #475569; }
    .lookup-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .lookup-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(99,102,241,0.35);
      white-space: nowrap;
    }
    .lookup-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.5); }
    .lookup-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Loading ─────────────────────────────────────────────────── */
    .loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 0; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(99,102,241,0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 0.9rem; }

    /* ── Error ───────────────────────────────────────────────────── */
    .error-wrap {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px; padding: 20px; text-align: center;
    }
    .error-icon { font-size: 2rem; margin-bottom: 8px; }
    .error-msg { color: #fca5a5; font-size: 0.9rem; }

    /* ── Order Result ────────────────────────────────────────────── */
    .result-header { margin-bottom: 28px; }
    .result-title-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 8px;
    }
    .result-title { font-size: 1.2rem; font-weight: 700; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.02em;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Info grid */
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 24px;
    }
    @media (max-width: 520px) { .info-grid { grid-template-columns: 1fr; } }
    .info-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
    }
    .info-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .info-value { font-size: 0.9rem; font-weight: 500; word-break: break-word; }
    .info-item.full { grid-column: 1 / -1; }
    .price-value { color: var(--green); font-weight: 700; font-size: 1.05rem; }

    /* Carrier box */
    .carrier-box {
      background: var(--blue-bg);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 12px; padding: 16px 18px;
      margin-bottom: 28px;
    }
    .carrier-title {
      font-size: 0.8rem; color: #93c5fd;
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 10px; font-weight: 600;
    }
    .carrier-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .carrier-row:last-child { margin-bottom: 0; }
    .carrier-label { font-size: 0.8rem; color: var(--muted); min-width: 110px; }
    .carrier-value { font-size: 0.88rem; color: var(--text); font-weight: 500; }
    .awb-code {
      font-family: 'Fira Code', 'Courier New', monospace;
      background: rgba(59,130,246,0.15);
      color: #60a5fa;
      padding: 2px 8px; border-radius: 5px;
    }

    /* Awaiting box */
    .awaiting-box {
      background: var(--yellow-bg);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 12px; padding: 16px 18px;
      margin-bottom: 28px;
      text-align: center; color: #fde68a;
      font-size: 0.9rem;
    }

    /* ── Timeline ────────────────────────────────────────────────── */
    .timeline { display: flex; flex-direction: column; gap: 0; margin-bottom: 28px; }
    .timeline-step { display: flex; gap: 16px; }
    .timeline-left { display: flex; flex-direction: column; align-items: center; }
    .step-circle {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
      transition: all 0.4s;
    }
    .step-circle.done {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 12px rgba(16,185,129,0.4);
    }
    .step-circle.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
      animation: pulse-step 2s ease-in-out infinite;
    }
    .step-circle.pending {
      background: var(--surface-2);
      border: 2px solid var(--border-strong);
      color: var(--muted);
    }
    @keyframes pulse-step {
      0%, 100% { box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
      50% { box-shadow: 0 4px 24px rgba(99,102,241,0.7); }
    }
    .step-line { flex: 1; width: 2px; background: var(--border); margin: 4px 0; min-height: 32px; transition: background 0.4s; }
    .step-line.done { background: linear-gradient(to bottom, #10b981, #10b981); }
    .step-line.active { background: linear-gradient(to bottom, #6366f1, var(--border)); }
    .timeline-step:last-child .step-line { display: none; }
    .step-content { padding: 4px 0 28px 0; }
    .step-title { font-size: 0.95rem; font-weight: 600; }
    .step-title.done { color: var(--green); }
    .step-title.active { color: #818cf8; }
    .step-title.pending { color: var(--muted); }
    .step-desc { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

    /* ── Actions ─────────────────────────────────────────────────── */
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-outline {
      padding: 10px 18px; border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--muted); font-size: 0.875rem;
      font-family: inherit; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--text); }
    .btn-primary {
      padding: 10px 20px; border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-size: 0.875rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }

    /* ── Cancelled ───────────────────────────────────────────────── */
    .cancelled-box {
      background: var(--red-bg); border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px; padding: 18px; text-align: center;
      margin-bottom: 24px; color: #fca5a5; font-size: 0.9rem;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    .footer {
      margin-top: 28px; text-align: center;
      font-size: 0.78rem; color: #475569;
    }
    .footer a { color: #6366f1; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* ── Divider ─────────────────────────────────────────────────── */
    .divider { height: 1px; background: var(--border); margin: 24px 0; }

    @media (max-width: 480px) {
      .card { padding: 22px 18px; }
      .lookup-form { flex-direction: column; }
      .lookup-btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>

<div class="page">
  <header class="header">
    <a class="logo" href="#">
      <div class="logo-icon">📦</div>
      <span class="logo-text">Order Tracking</span>
    </a>
    <span class="header-tag">Powered by FormDock</span>
  </header>

  <main class="card" id="main-card">
    <!-- Content injected by JS -->
  </main>

  <footer class="footer">
    This shop is powered by <strong>FormDock</strong> · Official Order Tracking Page by <strong>FormDock</strong> · <a href="#">Privacy Policy</a>
  </footer>
</div>

<script>
  // ── Configuration ─────────────────────────────────────────────────
  // Automatically defaults to http://127.0.0.1:8000 for local testing.
  const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || !window.location.hostname)
    ? 'http://127.0.0.1:8000'
    : 'https://api.formdock.in';

  // ── Helpers ───────────────────────────────────────────────────────
  function el(id) { return document.getElementById(id); }
  const card = document.getElementById('main-card');

  function getTokenFromURL() {
    // Supports:
    //   track.domain.com/<token>
    //   track.domain.com/?token=<token>
    //   track.domain.com/orders/track/<token>
    const path = window.location.pathname;
    const segments = path.split('/').filter(Boolean);
    // Check for UUID in path segments
    const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    for (const seg of segments) {
      if (uuidRe.test(seg)) return seg;
    }
    // Fallback: query param ?token=
    const params = new URLSearchParams(window.location.search);
    return params.get('token') || '';
  }

  // ── Status helpers ─────────────────────────────────────────────────
  const STATUS_META = {
    pending:   { label: 'Pending',   color: '#f59e0b', bg: 'rgba(245,158,11,0.15)',   border: 'rgba(245,158,11,0.3)' },
    delivery:  { label: 'Shipping',  color: '#3b82f6', bg: 'rgba(59,130,246,0.15)',   border: 'rgba(59,130,246,0.3)' },
    completed: { label: 'Delivered', color: '#10b981', bg: 'rgba(16,185,129,0.15)',  border: 'rgba(16,185,129,0.3)' },
    cancelled: { label: 'Cancelled', color: '#ef4444', bg: 'rgba(239,68,68,0.15)',   border: 'rgba(239,68,68,0.3)' },
  };

  function stepState(stepName, orderStatus) {
    const order = ['pending', 'delivery', 'completed'];
    const idx = order.indexOf(orderStatus);
    const stepIdx = order.indexOf(stepName);
    if (orderStatus === 'cancelled') return 'pending';
    if (stepIdx < idx) return 'done';
    if (stepIdx === idx) return 'active';
    return 'pending';
  }

  function stepIcon(state) {
    if (state === 'done')   return '✓';
    if (state === 'active') return '●';
    return '○';
  }

  // ── Render functions ───────────────────────────────────────────────
  function renderLookup(prefill = '') {
    card.innerHTML = `
      <div class="lookup-section">
        <div class="lookup-icon">🔍</div>
        <h1 class="lookup-title">Track Your Order</h1>
        <p class="lookup-sub">Enter the tracking token from your order confirmation email or SMS.</p>
        <form class="lookup-form" id="lookup-form">
          <input
            id="token-input"
            class="lookup-input"
            type="text"
            placeholder="Paste your tracking token here…"
            value="${prefill}"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="lookup-btn" type="submit" id="lookup-submit">Track</button>
        </form>
      </div>
    `;
    el('lookup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const token = el('token-input').value.trim();
      if (!token) return;
      fetchOrder(token);
    });
    if (prefill) el('lookup-form').dispatchEvent(new Event('submit'));
  }

  function renderLoading() {
    card.innerHTML = `
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p class="loading-text">Connecting to logistics server…</p>
      </div>
    `;
  }

  function renderError(msg, token = '') {
    card.innerHTML = `
      <div class="error-wrap">
        <div class="error-icon">⚠️</div>
        <p class="error-msg">${msg}</p>
      </div>
      <div class="divider"></div>
      <div style="text-align:center">
        <button class="btn-outline" onclick="renderLookup('${token}')">← Try Again</button>
      </div>
    `;
  }

  function renderOrder(data, token) {
    const status = data.status || 'pending';
    const meta = STATUS_META[status] || STATUS_META.pending;
    const isCancelled = status === 'cancelled';
    const orderId = (data.order_id || data.id || '').substring(0, 8).toUpperCase();

    const price = Number(data.total_price || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
    const date = data.created_at ? new Date(data.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
    const isSelfDelivery = data.shipping_provider === 'self';
    const provider = isSelfDelivery 
      ? `Self Delivery ${data.delivery_person_name ? `(Driver: ${data.delivery_person_name})` : ''}` 
      : (data.shipping_provider === 'shiprocket' ? 'Shiprocket' : (data.shipping_provider === 'delhivery' ? 'Delhivery' : (data.shipping_provider || '—')));

    // Timeline steps
    let timelineHTML = '';
    if (isCancelled) {
      timelineHTML = `<div class="cancelled-box">❌ This order has been <strong>cancelled</strong>. Please contact the seller if you need assistance.</div>`;
    } else if (Array.isArray(data.timeline) && data.timeline.length > 0) {
      timelineHTML = `<div class="timeline">${data.timeline.map(t => {
        const state = t.done ? 'done' : (t.error ? 'active' : 'upcoming');
        const icon = t.done ? '✓' : (t.error ? '✕' : '○');
        return `
          <div class="timeline-step">
            <div class="timeline-left">
              <div class="step-circle ${state}">${icon}</div>
              <div class="step-line ${state}"></div>
            </div>
            <div class="step-content">
              <div class="step-title ${state}">${t.status}</div>
              <div class="step-desc">${t.time ? `At ${t.time}` : (t.status === 'Dispatched for Delivery' && data.delivery_person_name ? `Out for delivery with ${data.delivery_person_name}` : '')}</div>
            </div>
          </div>`;
      }).join('')}</div>`;
    } else {
      const steps = [
        { key: 'pending',   title: 'Order Placed',            desc: 'Order confirmed and verified' },
        { key: 'delivery',  title: 'Logistics Dispatched',     desc: data.delivery_person_name ? `Assigned to delivery driver: ${data.delivery_person_name}` : (data.tracking_number ? `AWB booked with ${provider}` : 'Pending logistics assignment') },
        { key: 'completed', title: 'Delivered',               desc: data.customer_confirmed_at ? `Customer confirmed receipt on ${data.customer_confirmed_at}` : 'Package delivered to destination' },
      ];
      timelineHTML = `<div class="timeline">${steps.map(s => {
        const state = stepState(s.key, status);
        return `
          <div class="timeline-step">
            <div class="timeline-left">
              <div class="step-circle ${state}">${stepIcon(state)}</div>
              <div class="step-line ${state}"></div>
            </div>
            <div class="step-content">
              <div class="step-title ${state}">${s.title}</div>
              <div class="step-desc">${s.desc}</div>
            </div>
          </div>`;
      }).join('')}</div>`;
    }

    const driverBox = data.delivery_person_name ? `
      <div class="carrier-row">
        <span class="carrier-label">🛵 Delivery Personnel</span>
        <span class="carrier-value" style="color:#10b981;font-weight:600">${data.delivery_person_name}</span>
      </div>
    ` : '';

    const confirmBox = data.customer_confirmed_at ? `
      <div class="carrier-row">
        <span class="carrier-label">✅ Received Confirmed</span>
        <span class="carrier-value" style="color:#34d399;font-weight:500">${data.customer_confirmed_at}</span>
      </div>
    ` : '';

    const carrierHTML = (data.tracking_number || data.delivery_person_name || isSelfDelivery)
      ? `<div class="carrier-box">
          <div class="carrier-title">🚚 Delivery Details</div>
          <div class="carrier-row">
            <span class="carrier-label">Carrier / Provider</span>
            <span class="carrier-value">${provider}</span>
          </div>
          ${driverBox}
          ${data.tracking_number ? `<div class="carrier-row">
            <span class="carrier-label">AWB / Tracking ID</span>
            <span class="carrier-value"><code class="awb-code">${data.tracking_number}</code></span>
          </div>` : ''}
          <div class="carrier-row">
            <span class="carrier-label">Delivery Status</span>
            <span class="carrier-value">${data.tracking_status || (status === 'delivery' ? 'Out for Delivery' : status.toUpperCase())}</span>
          </div>
          ${confirmBox}
        </div>`
      : (status !== 'cancelled' ? `<div class="awaiting-box">⏳ Your order is being prepared for dispatch. Tracking details will appear here once assigned.</div>` : '');

    const canCancel = (data.can_cancel !== false) && (status !== 'delivery' && status !== 'completed' && status !== 'cancelled');
    const canConfirmReceive = Boolean(data.can_confirm_receive);

    const cancelBtnHTML = canCancel
      ? `<button class="btn-cancel" style="padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(239,68,68,0.4); background: rgba(239,68,68,0.15); color: #fca5a5; font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s;" onclick="cancelOrder('${token}')">✖ Cancel Order</button>`
      : '';

    const confirmBtnHTML = canConfirmReceive
      ? `<button class="btn-confirm" style="padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(16,185,129,0.4); background: rgba(16,185,129,0.15); color: #6ee7b7; font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s;" onclick="confirmReceiveOrder('${token}')">✅ Confirm Order Received</button>`
      : '';

    card.innerHTML = `
      <div style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25); padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; color: #a5b4fc; margin-bottom: 20px; text-align: center;">
        ⚡ This shop is powered by <strong>FormDock</strong> — Official Order Tracking Page by FormDock
      </div>
      <div class="result-header">
        <div class="result-title-row">
          <div>
            <p style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">ORDER DETAILS</p>
            <h1 class="result-title">Order #${orderId}</h1>
          </div>
          <span class="status-pill" style="background:${meta.bg};color:${meta.color};border:1px solid ${meta.border}">
            <span class="status-dot" style="background:${meta.color}"></span>
            ${meta.label}
          </span>
        </div>
        <p style="font-size:0.8rem;color:var(--muted)">Placed on ${date}</p>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Product</div>
          <div class="info-value">${data.product_name || '—'}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Quantity</div>
          <div class="info-value">${data.quantity || '—'}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Amount Paid</div>
          <div class="info-value price-value">₹${price}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Buyer Name</div>
          <div class="info-value">${data.customer_name || '—'}</div>
        </div>
        <div class="info-item full">
          <div class="info-label">Delivery Address</div>
          <div class="info-value">${data.shipping_address || '—'}</div>
        </div>
      </div>

      ${carrierHTML}

      <div class="divider"></div>
      <p style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.06em">Shipment Timeline</p>
      ${timelineHTML}

      <div class="actions">
        <button class="btn-outline" onclick="renderLookup('${token}')">← Track Another</button>
        <button class="btn-primary" onclick="refreshOrder('${token}')">🔄 Refresh Status</button>
        ${confirmBtnHTML}
        ${cancelBtnHTML}
      </div>
    `;
  }

  // ── API call ───────────────────────────────────────────────────────
  async function fetchOrder(token) {

    renderLoading();
    const endpoints = [
      `${API_BASE}/api/v1/public/orders/track/${token}/`,
      `${API_BASE}/api/public/orders/track/${token}/`,
      `http://127.0.0.1:8000/api/v1/public/orders/track/${token}/`,
      `http://localhost:8000/api/v1/public/orders/track/${token}/`
    ];

    let lastError = 'Could not connect to the tracking server. Please ensure the backend is running.';
    for (const url of endpoints) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (res.ok) {
          renderOrder(data, token);
          history.replaceState(null, '', `?token=${token}`);
          return;
        } else if (res.status === 404 || data.error || data.detail) {
          const msg = data.error || data.detail || 'Order not found. Please check your tracking token.';
          renderError(msg, token);
          return;
        }

      } catch (err) {
        lastError = err.message || lastError;
      }
    }
    renderError('Could not connect to the tracking server at http://127.0.0.1:8000. Is your Django backend running?', token);
  }


  function refreshOrder(token) {
    fetchOrder(token);
  }

  async function confirmReceiveOrder(token) {
    if (!confirm('Have you received your package? Confirming will update the seller dashboard and delivery status.')) return;
    renderLoading();
    const endpoints = [
      `${API_BASE}/api/v1/public/orders/track/${token}/confirm-receive/`,
      `${API_BASE}/api/public/orders/track/${token}/confirm-receive/`,
      `http://127.0.0.1:8000/api/v1/public/orders/track/${token}/confirm-receive/`,
      `http://localhost:8000/api/v1/public/orders/track/${token}/confirm-receive/`
    ];

    for (const url of endpoints) {
      try {
        const res = await fetch(url, { method: 'POST' });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('✓ Order delivery confirmed! Thank you.');
          fetchOrder(token);
          return;
        } else if (data.error || data.detail) {
          alert('Failed to confirm order receipt: ' + (data.error || data.detail));
          fetchOrder(token);
          return;
        }
      } catch (err) {
        console.error(err);
      }
    }
    fetchOrder(token);
  }

  async function cancelOrder(token) {
    if (!confirm('Are you sure you want to cancel your order? This will release reserved product stock.')) return;
    renderLoading();
    const endpoints = [
      `${API_BASE}/api/v1/public/orders/track/${token}/cancel/`,
      `${API_BASE}/api/public/orders/track/${token}/cancel/`,
      `http://127.0.0.1:8000/api/v1/public/orders/track/${token}/cancel/`,
      `http://localhost:8000/api/v1/public/orders/track/${token}/cancel/`
    ];

    for (const url of endpoints) {
      try {
        const res = await fetch(url, { method: 'POST' });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('✓ Order cancelled successfully. Stock has been restored.');
          fetchOrder(token);
          return;
        } else if (data.error || data.detail) {
          alert('Failed to cancel order: ' + (data.error || data.detail));
          fetchOrder(token);
          return;
        }
      } catch (err) {
        console.error(err);
      }
    }
    fetchOrder(token);
  }

  // ── Boot ───────────────────────────────────────────────────────────
  (function init() {
    const token = getTokenFromURL();
    renderLookup(token); // if token found, lookup-form submit fires automatically
  })();
</script>
</body>
</html>
